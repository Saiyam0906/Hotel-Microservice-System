spring.application.name=USER-SERVICE

spring.config.import=optional:configserver:http://localhost:8085
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true


aws.region=ap-south-1
aws.bucket=hotel-user-profile-photos
aws.presigned-url.expiration-minutes=15

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.application.name=USER-SERVICE

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://saiyam09.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=http://localhost:8084
management.zipkin.tracing.enabled=false