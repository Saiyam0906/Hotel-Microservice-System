spring.application.name=ApiGateway
server.port=8084



eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka


spring.cloud.gateway.server.webmvc.routes[0].id=USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=HOTEL
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://HOTEL
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/hotels/**

spring.cloud.gateway.server.webmvc.routes[2].id=RATING
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://RATING
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/ratings/**

spring.cloud.gateway.server.webmvc.routes[3].id=AGGREGATOR
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://AGGREGATOR
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/aggregate/**



management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.application.name=ApiGateway

